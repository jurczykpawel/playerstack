name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js (Astro requires >=22.12)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (core)
        run: bunx tsc --noEmit -p packages/core/tsconfig.json

      - name: Type check (plugins)
        run: |
          for pkg in packages/plugin-*; do
            bunx tsc --noEmit -p "$pkg/tsconfig.json"
          done

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build standalone bundle
        run: bun run --cwd packages/embed build

      - name: Copy bundle to docs public
        run: cp packages/embed/dist/playerstack.min.js apps/docs/public/playerstack.min.js

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Build docs site
        run: bun run --cwd apps/docs build

      - name: Upload docs dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-pages
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download docs dist
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/docs/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=playerstack-docs --branch=main

      - name: Smoke test
        run: curl -sf https://playerstack.sellf.app/ -o /dev/null

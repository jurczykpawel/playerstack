name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (core)
        run: bunx tsc --noEmit -p packages/core/tsconfig.json

      - name: Type check (plugins)
        run: |
          for pkg in packages/plugin-*; do
            bunx tsc --noEmit -p "$pkg/tsconfig.json"
          done

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build standalone bundle
        run: bun run --cwd packages/embed build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Build docs site
        run: bun run --cwd apps/docs build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches new advisories while nothing is being pushed.
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  # Dependabot alerts read the package.json files only; this reads bun.lock,
  # including transitive dependencies.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Audit bun.lock (high and critical)
        run: bun audit --audit-level=high

  test:
    name: Test & build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (Astro requires >=22.23.4)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (core)
        run: bunx tsc --noEmit -p packages/core/tsconfig.json

      - name: Type check (plugins)
        run: |
          for pkg in packages/plugin-*; do
            bunx tsc --noEmit -p "$pkg/tsconfig.json"
          done

      - name: Type check (embed)
        run: bun run typecheck:embed

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build standalone bundle
        run: bun run --cwd packages/embed build

      - name: Copy bundle to docs public
        run: bash scripts/copy-standalone.sh apps/docs/public

      - name: Stage versioned release (v/<id>/ with SRI hashes)
        run: bun packages/embed/release-versions.ts stage apps/docs/public

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build docs site
        run: bun run --cwd apps/docs build

      - name: E2E tests
        run: bun run test:e2e

      - name: Check docs page titles
        run: bun scripts/check-docs-titles.ts

      # Pages keeps only what one deploy uploads: copy every published version
      # from the live site (verified against its SRI hash) into this build.
      - name: Carry over published versions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bun packages/embed/release-versions.ts carry apps/docs/dist https://playerstack.techskills.academy

      - name: Upload docs dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One deploy at a time, none interrupted or dropped from the queue. A run that
    # is no longer the tip of main deploys nothing, so an older build cannot
    # replace a newer one.
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check that this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Cannot read the tip of main"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $GITHUB_SHA, main is at $tip"
          fi

      - name: Download docs dist
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-dist
          path: apps/docs/dist

      - name: Deploy to Cloudflare Pages
        if: steps.tip.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dependabot does not update this input; raise it with the action.
          wranglerVersion: "4.162.0"
          command: pages deploy apps/docs/dist --project-name=playerstack --branch=main

      - name: Smoke test
        if: steps.tip.outputs.current == 'true'
        run: curl -sf https://playerstack.techskills.academy/ -o /dev/null

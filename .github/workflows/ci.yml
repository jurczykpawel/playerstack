name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (Astro requires >=22.12)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (core)
        run: bunx tsc --noEmit -p packages/core/tsconfig.json

      - name: Type check (plugins)
        run: |
          for pkg in packages/plugin-*; do
            bunx tsc --noEmit -p "$pkg/tsconfig.json"
          done

      - name: Type check (embed)
        run: bun run typecheck:embed

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build standalone bundle
        run: bun run --cwd packages/embed build

      - name: Copy bundle to docs public
        run: bash scripts/copy-standalone.sh apps/docs/public

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build docs site
        run: bun run --cwd apps/docs build

      - name: E2E tests
        run: bun run test:e2e

      - name: Check docs page titles
        run: bun scripts/check-docs-titles.ts

      - name: Upload docs dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-pages
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download docs dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-dist
          path: apps/docs/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=playerstack --branch=main

      - name: Smoke test
        run: curl -sf https://playerstack.techskills.academy/ -o /dev/null

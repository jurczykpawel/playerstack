# Version updates only. Dependabot security updates cannot update bun.lock, so
# they are switched off in the repository settings. Dependabot alerts stay on,
# and the Audit job in .github/workflows/ci.yml checks the lockfile.
version: 2
updates:
- package-ecosystem: bun
  directory: /
  commit-message:
    prefix: chore(deps)
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  commit-message:
    prefix: chore(ci)
  schedule:
    interval: quarterly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    actions:
      patterns:
      - '*'
